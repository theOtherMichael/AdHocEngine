			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/sh\nset -euo pipefail\n\nTRIPLET_DIR=\"dynamic/arm64-osx-dynamic-adhoc\"\n\nCOPY_JOBS=(\n    \"${PROJECT_DIR}/vcpkg_installed/${TRIPLET_DIR}/debug/lib:${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\n    \"${PROJECT_DIR}/../Engine/vcpkg_installed/${TRIPLET_DIR}/debug/lib:${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\n    \"${PROJECT_DIR}/../Editor/vcpkg_installed/${TRIPLET_DIR}/debug/lib:${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\n)\n\nfor job in \"${COPY_JOBS[@]}\"; do\n    src=\"${job%%:*}\"\n    dst=\"${job##*:}\"\n\n    if [ ! -d \"${src}\" ]; then\n        echo \"Skipping ${src} (not found)\"\n        continue\n    fi\n\n    mkdir -p \"${dst}\"\n\n    find \"${src}\" -name \"*.dylib\" | while read -r dylib; do\n        if [ -L \"$dylib\" ]; then\n            continue\n        fi\n\n        lib_name=$(basename \"$dylib\")\n        lib_dst=\"${dst}/${lib_name}\"\n\n        echo \"Copying ${lib_name} -> ${dst}\"\n        cp -f \"$dylib\" \"$lib_dst\"\n        chmod +w \"$lib_dst\"\n\n        install_name_tool -id \"@executable_path/../Frameworks/${lib_name}\" \"$lib_dst\"\n\n        if [ \"${CODE_SIGNING_ALLOWED}\" = \"YES\" ]; then\n            codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \\\n                ${OTHER_CODE_SIGN_FLAGS:-} \\\n                \"${lib_dst}\"\n        fi\n    done\ndone\n";
		};
